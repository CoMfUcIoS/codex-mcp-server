---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: npm run format:check
      - name: Lint code
        run: npm run lint
      - name: Validate server startup (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          timeout 10s npm start || exit_code=$?
          if [ "$exit_code" -ne 124 ] && [ "$exit_code" -ne 0 ]; then
            echo "Server failed to start properly"
            exit 1
          fi
          echo "Server validation passed"
      - name: Validate server startup (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $process = Start-Process "npm" "start" -PassThru
          if ($process.WaitForExit(10000)) {
            $exit_code = $process.ExitCode
          } else {
            $process.Kill()
            $exit_code = 124
          }
          if (($exit_code -ne 124) -and ($exit_code -ne 0)) {
            Write-Host "Server failed to start properly"
            exit 1
          }
          Write-Host "Server validation passed"
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run security audit
        run: npm audit --audit-level moderate
      - name: Check for outdated dependencies
        run: npm outdated || true

